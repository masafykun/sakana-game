<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>フィッシュフレンジー - 海のヌシをめざせ</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:#02101c;color:#eafcff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hudTop{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 14px 0;
  }
  #scoreWrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  #scoreBox{
    display:inline-flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:999px;
    border:1px solid rgba(150,235,255,.28);background:rgba(2,28,48,.42);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 26px rgba(0,0,0,.25);
  }
  #scoreLabel{font-size:12px;letter-spacing:.1em;color:#bff7ff;font-weight:800;opacity:.85}
  #score{
    display:inline-block;min-width:1.4em;font-size:clamp(24px,5.5vw,40px);font-weight:900;color:#fff3a0;
    text-shadow:0 2px 12px rgba(0,30,50,.8);transition:transform .12s cubic-bezier(.3,1.6,.5,1);
  }
  #bestBox{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#9fe9ff;
    padding:3px 8px;letter-spacing:.06em;border-radius:999px;background:rgba(2,28,48,.22);
  }
  #bestBox b{color:#ffd86b}
  #stageWrap{
    display:inline-flex;flex-direction:column;gap:5px;width:min(200px,48vw);padding:7px 12px;border-radius:14px;
    border:1px solid rgba(150,235,255,.22);background:rgba(2,28,48,.36);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #stageName{font-size:13px;font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  #stageName .ico{font-size:15px}
  #stageBarBg{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  #stageBar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#7df0ff,#ffe26b,#ff67c7);transition:width .25s ease}
  #soundBtn{
    pointer-events:auto;width:42px;height:42px;flex:0 0 auto;border:1px solid rgba(150,235,255,.28);border-radius:50%;
    background:rgba(2,28,48,.42);color:#eafcff;font-size:18px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  }
  #soundBtn:active{transform:scale(.94)}
  #combo{
    position:absolute;top:20%;left:50%;transform:translate(-50%,0);opacity:0;text-align:center;transition:opacity .18s ease;
  }
  #combo.show{opacity:1}
  #comboMult{
    font-size:clamp(40px,12vw,84px);font-weight:900;line-height:.9;color:#fff;
    text-shadow:0 0 18px rgba(120,240,255,.9),0 4px 16px rgba(0,20,40,.6);
  }
  #comboLabel{font-size:clamp(11px,3vw,16px);font-weight:900;letter-spacing:.16em;color:#ffe26b;margin-top:2px;text-shadow:0 2px 10px rgba(0,20,40,.7)}
  #comboBarBg{margin:7px auto 0;width:clamp(90px,30vw,160px);height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  #comboBar{height:100%;width:100%;background:linear-gradient(90deg,#ffd24a,#ff6ba8);border-radius:99px}
  @keyframes comboPop{0%{transform:scale(.55)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
  #combo.bump #comboMult{animation:comboPop .26s ease}
  #help{
    position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
    max-width:min(620px,calc(100vw - 26px));text-align:center;padding:9px 14px;border-radius:14px;
    background:rgba(2,28,48,.32);border:1px solid rgba(150,235,255,.18);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:clamp(11px,2.6vw,14px);line-height:1.5;transition:opacity .6s ease;
  }
  #help.hide{opacity:0}
  #help b{color:#ffd86b}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0;mix-blend-mode:screen}
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 48%,rgba(0,7,15,.57) 100%);
  }
  #dangerFlash{
    position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,20,70,0) 54%,rgba(255,20,70,.55) 100%);
    transition:opacity .08s linear;
  }
  #banner{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;opacity:0;text-align:center}
  #banner .big{
    font-size:clamp(30px,9vw,66px);font-weight:900;letter-spacing:.04em;color:#fff;
    text-shadow:0 0 26px rgba(255,220,110,.95),0 6px 20px rgba(0,20,40,.6);
  }
  #banner .sub{font-size:clamp(13px,3.4vw,19px);font-weight:900;color:#ffe9a6;letter-spacing:.2em;margin-top:4px}
  @keyframes bannerShow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    30%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}
  }
  #banner.play{animation:bannerShow 1.7s ease forwards}
  #popups{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  @keyframes popRise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
    18%{opacity:1;transform:translate(-50%,-95%) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-220%) scale(1)}
  }
  .pop{
    position:absolute;font-weight:900;color:#fff6b0;text-shadow:0 2px 10px rgba(0,20,40,.7);white-space:nowrap;
    animation:popRise .9s ease-out forwards;will-change:transform,opacity;
  }
  .pop.big{color:#fff;text-shadow:0 0 16px rgba(120,240,255,.95),0 3px 12px rgba(0,20,40,.7)}
  .overlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;pointer-events:auto;
    background:radial-gradient(circle at center,rgba(0,40,66,.32),rgba(0,6,14,.82));
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .overlay.hidden{display:none}
  .panel{
    width:min(450px,93vw);padding:28px 22px 22px;border:1px solid rgba(180,245,255,.3);border-radius:28px;
    background:rgba(3,26,46,.84);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .panel h1{margin:0 0 6px;font-size:clamp(30px,8vw,46px);letter-spacing:.04em}
  .panel .tag{font-size:13px;color:#bff7ff;letter-spacing:.18em;font-weight:900;opacity:.9;margin-bottom:14px}
  .scoreLine{font-size:16px;color:#dff7ff;margin:4px 0}
  .scoreLine b{font-size:31px;color:#fff3a0;font-weight:900}
  #record{
    display:none;margin:10px auto 4px;padding:5px 14px;border-radius:99px;background:linear-gradient(90deg,#ffcf4a,#ff8bd0);
    color:#3a1640;font-weight:900;font-size:13px;letter-spacing:.06em;width:max-content;
  }
  #record.show{display:block;animation:recordPulse 1s ease infinite alternate}
  @keyframes recordPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
  .btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .btn{
    appearance:none;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:900;cursor:pointer;letter-spacing:.02em;
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn.primary{color:#05304a;background:linear-gradient(180deg,#fff5a6,#75edff);box-shadow:0 12px 28px rgba(91,231,255,.3);font-size:17px;padding:15px 28px}
  .btn.share{color:#06324a;background:linear-gradient(180deg,#ffe98a,#ff91cc);box-shadow:0 10px 24px rgba(255,120,200,.22)}
  .btn.ghost{color:#eafcff;background:rgba(255,255,255,.1);border:1px solid rgba(160,235,255,.35)}
  .btn.x{color:#fff;background:#0a0a0a;border:1px solid rgba(255,255,255,.25)}
  .hint{margin-top:14px;font-size:12px;color:rgba(220,245,255,.62)}
  .howto{text-align:left;font-size:13.5px;line-height:1.7;color:#dff3ff;margin:8px auto 4px;max-width:340px}
  .howto b{color:#ffd86b}
  .spin{font-size:clamp(42px,13vw,72px);margin-bottom:4px;animation:floaty 3s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  #toast{
    position:fixed;left:50%;bottom:17%;transform:translateX(-50%) translateY(10px);z-index:12;
    background:rgba(10,40,64,.95);border:1px solid rgba(160,235,255,.4);color:#eafcff;
    padding:10px 18px;border-radius:999px;font-weight:900;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
  <div id="ui">
    <div class="hudTop">
      <div id="scoreWrap">
        <div id="scoreBox"><span id="scoreLabel">SCORE</span><span id="score">0</span></div>
        <div id="stageWrap">
          <div id="stageName"><span class="ico" id="stageIco">🐟</span><span id="stageNameTxt">小魚</span></div>
          <div id="stageBarBg"><div id="stageBar"></div></div>
        </div>
        <div id="bestBox">BEST <b id="best">0</b></div>
      </div>
      <button id="soundBtn" aria-label="sound">🔊</button>
    </div>
    <div id="combo">
      <div id="comboMult">2</div>
      <div id="comboLabel">COMBO ×2</div>
      <div id="comboBarBg"><div id="comboBar"></div></div>
    </div>
    <div id="help">🐟 指 / マウスで追従。餌と<b>小さい魚</b>を食べて成長！ <b>緑の光=食べられる</b> / <b>赤い光=危険</b>。連続で食べてコンボ倍率UP！</div>
  </div>

  <div id="banner"><div class="big" id="bannerBig"></div><div class="sub" id="bannerSub"></div></div>
  <div id="vignette"></div>
  <div id="dangerFlash"></div>
  <div id="flash"></div>
  <div id="popups"></div>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <div class="spin">🐠</div>
      <h1>フィッシュフレンジー</h1>
      <div class="tag">海のヌシをめざせ</div>
      <div class="howto">
        <div>🎯 餌と<b>自分より小さい魚</b>を食べて一気に成長</div>
        <div>🟢 緑の光=食べ頃 ／ 🔴 赤の光=今は逃げろ</div>
        <div>🔥 連続捕食でコンボ倍率アップ</div>
        <div>🏆 小魚 → 中型 → 大型 → <b>ヌシ</b>へ進化</div>
      </div>
      <div class="btnRow"><button class="btn primary" id="startBtn">タップでスタート</button></div>
      <div class="hint">スマホは親指1本でOK ／ PCはマウス・WASD</div>
    </div>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div class="panel">
      <h1>GAME OVER</h1>
      <div id="record">🎉 ニューレコード！</div>
      <div class="scoreLine">スコア <b id="finalScore">0</b></div>
      <div class="scoreLine">ベスト <span id="finalBest" style="font-weight:900;color:#ffd86b;">0</span> ／ 到達 <span id="finalStage">小魚</span></div>
      <div class="btnRow">
        <button class="btn share" id="shareBtn">📣 記録を共有</button>
        <button class="btn ghost" id="copyBtn">📋 コピー</button>
        <button class="btn x" id="xBtn">𝕏</button>
      </div>
      <div class="btnRow"><button class="btn primary" id="restartBtn">もう一度泳ぐ</button></div>
      <div class="hint">画面タップ / Enter / Space でも即リスタート</div>
    </div>
  </div>

  <div id="toast"></div>

<script type="module">
import * as THREE from "three";

const $ = (id) => document.getElementById(id);
const clamp = THREE.MathUtils.clamp;
const rand = (a,b) => a + Math.random() * (b - a);

const scoreEl=$("score"), bestEl=$("best"), stageNameTxt=$("stageNameTxt"), stageIco=$("stageIco"), stageBar=$("stageBar");
const comboEl=$("combo"), comboMultEl=$("comboMult"), comboLabelEl=$("comboLabel"), comboBar=$("comboBar");
const helpEl=$("help"), flashEl=$("flash"), dangerFlashEl=$("dangerFlash"), bannerEl=$("banner"), bannerBig=$("bannerBig"), bannerSub=$("bannerSub");
const popupsEl=$("popups"), toastEl=$("toast"), startScreen=$("startScreen"), gameOverEl=$("gameOver");
const finalScoreEl=$("finalScore"), finalBestEl=$("finalBest"), finalStageEl=$("finalStage"), recordEl=$("record");

const IS_TOUCH = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || "ontouchstart" in window;
const IS_SMALL = Math.min(window.innerWidth, window.innerHeight) < 680;
const LOW = IS_TOUCH || IS_SMALL;
const DPR_CAP = LOW ? 1.5 : 2;

const ENEMY_POOL = LOW ? 10 : 15;
const FOOD_COUNT = LOW ? 24 : 38;
const PARTICLE_COUNT = LOW ? 120 : 190;
const TRAIL_COUNT = LOW ? 42 : 64;
const BUBBLE_COUNT = LOW ? 62 : 94;
const PLANKTON_COUNT = LOW ? 120 : 210;
const BOID_COUNT = LOW ? 14 : 24;
const BOKEH_COUNT = LOW ? 10 : 17;

const MAX_FISH_SPEED = 4.8;
const COMBO_TIME = 2.35;
const PLAYER_MAX_SCALE = 5.25;

const STAGES = [
  { name:"小魚", min:1.00, icon:"🐟", color:0xffd86b },
  { name:"中型魚", min:1.55, icon:"🐠", color:0x7df0ff },
  { name:"大型魚", min:2.45, icon:"🐡", color:0xb98bff },
  { name:"ヌシ", min:3.60, icon:"🦈", color:0xff5b9e }
];

const FISH_COLORS = [
  {b:0x4a90d9,f:0x9fd8ff},{b:0x8e44ad,f:0xe08cff},{b:0x16a085,f:0x8ff0d8},
  {b:0xe67e22,f:0xffd28c},{b:0xc0392b,f:0xff9b8c},{b:0x2c3e80,f:0x88a0ff},
  {b:0xd81b8c,f:0xffa6e6},{b:0x1abc9c,f:0xc8fff1}
];

let started=false, gameOver=false;
let score=0, best=0, goAt=0;
let playerScale=1, stageIndex=0;
let comboCount=0, combo=1, comboTimer=0;
let shake=0, globalSpeed=1, pointerActive=true, dangerPulse=0;
let camBaseX=0, camBaseY=0, muted=false;

try{ best=parseInt(localStorage.getItem("fishFrenzyBest_v2")) || 0; }catch(e){ best=0; }
bestEl.textContent=best;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x063247, 0.013);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 220);
camera.position.set(0,0,34);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:"high-performance" });
renderer.setClearColor(0x02101c, 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const tmpVec2 = new THREE.Vector2();
const tmpVec3 = new THREE.Vector3();
const tmpColor = new THREE.Color();
const WHITE = new THREE.Color(0xffffff);
const dummy = new THREE.Object3D();

let bounds = { minX:-16, maxX:16, minY:-10, maxY:10, width:32, height:20 };
const pointerTarget = new THREE.Vector2(0,0);
const keys = Object.create(null);

function makeSoftCircle(){
  const c=document.createElement("canvas");
  c.width=c.height=128;
  const g=c.getContext("2d");
  const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,"rgba(255,255,255,1)");
  r.addColorStop(.28,"rgba(255,255,255,.86)");
  r.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=r;
  g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const softTex = makeSoftCircle();

const bgUniforms = { uTime:{value:0}, uAspect:{value:window.innerWidth/window.innerHeight} };
const background = new THREE.Mesh(
  new THREE.PlaneGeometry(160,100,1,1),
  new THREE.ShaderMaterial({
    depthWrite:false, depthTest:false, uniforms:bgUniforms,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      precision mediump float;
      varying vec2 vUv;
      uniform float uTime;
      uniform float uAspect;
      float wave(vec2 p){
        float a=sin(p.x*16.0+uTime*.9+sin(p.y*8.0+uTime*.45));
        float b=sin((p.x+p.y)*26.0-uTime*1.25);
        float c=sin(length(p-vec2(.5,.62))*40.0-uTime*1.7);
        return (a+b+c)/3.0;
      }
      void main(){
        vec2 uv=vUv;
        uv.x+=sin(uv.y*10.0+uTime*.45)*.015;
        uv.y+=sin(uv.x*7.0-uTime*.35)*.012;
        vec3 deep=vec3(.004,.05,.11), mid=vec3(.02,.22,.35), top=vec3(.09,.6,.7);
        vec3 col=mix(deep,mid,smoothstep(0.0,1.0,uv.y));
        col=mix(col,top,pow(max(uv.y,0.0),2.2)*.6);
        float caustic=pow(abs(wave(uv*vec2(uAspect,1.0))),6.0)*.7;
        float caustic2=pow(abs(wave(uv*vec2(uAspect,1.0)*1.7+vec2(.3))),9.0)*.5;
        float shafts=smoothstep(.66,1.0,uv.y)*(.5+.5*sin((uv.x*16.0)+uTime*.32));
        float vig=smoothstep(.95,.2,distance(uv,vec2(.5,.54)));
        col+=vec3(.2,.55,.65)*(caustic+caustic2)*(.35+uv.y*.85);
        col+=vec3(.13,.36,.42)*shafts*.2;
        col*=.66+vig*.45;
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
background.position.z=-42;
background.renderOrder=-10;
scene.add(background);

const ambient = new THREE.HemisphereLight(0xa8f4ff, 0x001423, 1.15);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xd3fbff, 1.9);
sun.position.set(-8,14,12);
scene.add(sun);
const glowLight = new THREE.PointLight(0x5cf3ff, 1.55, 30, 2);
glowLight.position.set(6,5,8);
scene.add(glowLight);

const rays=[];
function makeRay(i){
  const mat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uSeed:{value:i*13.17} },
    vertexShader:`varying vec2 vUv;uniform float uTime;uniform float uSeed;void main(){vUv=uv;vec3 p=position;p.x+=sin(p.y*.16+uTime*.45+uSeed)*.35;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
    fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uSeed;void main(){float side=smoothstep(0.0,.5,vUv.x)*smoothstep(1.0,.5,vUv.x);float fade=smoothstep(0.0,.18,vUv.y)*smoothstep(1.0,.28,vUv.y);float fl=.65+.35*sin(uTime*.7+uSeed);gl_FragColor=vec4(.34,.9,1.0,side*fade*fl*.13);}`
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(4.5,46,1,8),mat);
  m.position.set(-18+i*6,2.4,-12-i*.4);
  m.rotation.z=THREE.MathUtils.degToRad(-12+i*4);
  return m;
}
for(let i=0;i<7;i++){ const r=makeRay(i); rays.push(r); scene.add(r); }

function createFish(opts){
  const group=new THREE.Group();
  const bodyColor = new THREE.Color(opts.body);
  const finColor = new THREE.Color(opts.fin);
  const bodyMat=new THREE.MeshStandardMaterial({
    color:bodyColor, roughness:.4, metalness:.05,
    emissive:bodyColor.clone().multiplyScalar(.14), emissiveIntensity:.62
  });
  const finMat=new THREE.MeshStandardMaterial({
    color:finColor, roughness:.5, metalness:0, side:THREE.DoubleSide,
    emissive:finColor.clone().multiplyScalar(.12), emissiveIntensity:.5
  });

  const body=new THREE.Mesh(new THREE.SphereGeometry(1,22,15),bodyMat);
  body.scale.set(1.42,.62,.5);
  group.add(body);

  const tailShape=new THREE.Shape();
  tailShape.moveTo(0,0); tailShape.lineTo(-.95,.72); tailShape.lineTo(-.62,0); tailShape.lineTo(-.95,-.72); tailShape.closePath();
  const tail=new THREE.Mesh(new THREE.ShapeGeometry(tailShape),finMat);
  tail.position.set(-1.2,0,0);
  group.add(tail);

  const topShape=new THREE.Shape();
  topShape.moveTo(-.4,.5); topShape.lineTo(.25,1.05); topShape.lineTo(.62,.42); topShape.closePath();

let audioCtx=null, masterGain=null, noiseBuf=null;
function initAudio(){
  if(audioCtx) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=.5;
    masterGain.connect(audioCtx.destination);
  }catch(e){}
}
function resumeAudio(){ if(audioCtx && audioCtx.state==="suspended") audioCtx.resume(); }
function tone(freq,dur,type,vol,slideTo){
  if(!audioCtx||muted) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type||"sine";
  o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+.02);
}
function getNoise(){
  if(noiseBuf) return noiseBuf;
  const len=(audioCtx.sampleRate*.4)|0;
  const b=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  noiseBuf=b;
  return b;
}
function noiseBurst(dur,vol,freq,q){
  if(!audioCtx||muted) return;
  const t=audioCtx.currentTime;
  const s=audioCtx.createBufferSource();
  s.buffer=getNoise();
  const bp=audioCtx.createBiquadFilter();
  bp.type="bandpass";
  bp.frequency.value=freq;
  bp.Q.value=q||1;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp); bp.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t+dur+.02);
}

function computeBounds(){
  const dist=34;
  const viewH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*dist;
  const viewW=viewH*camera.aspect;
  const margin=Math.max(1.25,Math.min(viewW,viewH)*.055);
  bounds.width=viewW; bounds.height=viewH;
  bounds.minX=-viewW*.5+margin; bounds.maxX=viewW*.5-margin;
  bounds.minY=-viewH*.5+margin; bounds.maxY=viewH*.5-margin;
}

    if(Math.hypot(x-player.position.x,y-player.position.y)>2.2) break;
  }
  f.x=x; f.y=y; f.z=rand(-1.2,1.2);
  f.phase=Math.random()*Math.PI*2;
  f.speed=.5+Math.random()*.9;

function snapFish(o,vx,vy){
  const h=Math.atan2(vy,vx);
  const left=vx<0;
  o.userData.facingLeft=left;
  o.userData.flip=left?1:0;
  o.rotation.y=o.userData.flip*Math.PI;
  o.rotation.z=left?(Math.PI-h):h;
}
function orientFish(o,vx,vy,dt,turn){
  if(vx*vx+vy*vy<1e-7) return;
  const h=Math.atan2(vy,vx);
  if(vx>.02) o.userData.facingLeft=false;
  else if(vx<-.02) o.userData.facingLeft=true;
  const left=o.userData.facingLeft;
  const tz=left?(Math.PI-h):h;
  let dz=tz-o.rotation.z;
  dz=Math.atan2(Math.sin(dz),Math.cos(dz));
  o.rotation.z+=dz*Math.min(1,dt*turn);
  const tf=left?1:0;
  o.userData.flip+=(tf-o.userData.flip)*Math.min(1,dt*(turn*1.2));
  o.rotation.y=o.userData.flip*Math.PI;
}
function animateFish(g,t,sf=1){
  const tail=g.userData.tail, fins=g.userData.sideFins, body=g.userData.body;
  if(tail) tail.rotation.z=Math.sin(t*9*sf+g.position.x*.3)*.34;
  if(fins){
    const fl=-.18+Math.sin(t*6.5*sf)*.22;
    fins[0].rotation.z=fl; fins[1].rotation.z=fl;
  }
  if(body) body.scale.y=.62+Math.sin(t*8.2*sf+g.position.y)*.02;
}
function respawnEnemy(e,first=false){
  let x,y;
  const side=(Math.random()*4)|0;
  if(side===0){x=bounds.minX-rand(2,6);y=rand(bounds.minY,bounds.maxY)}
  else if(side===1){x=bounds.maxX+rand(2,6);y=rand(bounds.minY,bounds.maxY)}
  else if(side===2){x=rand(bounds.minX,bounds.maxX);y=bounds.minY-rand(2,5)}
  else{x=rand(bounds.minX,bounds.maxX);y=bounds.maxY+rand(2,5)}
  if(first){
    for(let k=0;k<50;k++){
      x=rand(bounds.minX,bounds.maxX); y=rand(bounds.minY,bounds.maxY);
      if(Math.hypot(x-player.position.x,y-player.position.y)>7) break;
    }
  }
  e.position.set(x,y,rand(-.25,.25));
  e.userData.size=spawnSize();
  e.scale.setScalar(e.userData.size);
  e.userData.baseSpeed=1.3+Math.random()*1.1;
  e.userData.phase=Math.random()*Math.PI*2;
  const tx=rand(bounds.minX,bounds.maxX), ty=rand(bounds.minY,bounds.maxY);
  e.userData.velocity.set(tx-x,ty-y).normalize();
  snapFish(e,e.userData.velocity.x,e.userData.velocity.y);
}

  camBaseY=0;
  dangerPulse=0;
  dangerFlashEl.style.opacity="0";
  scoreEl.textContent=0;
  bestEl.textContent=best;
  updateStageUI();
  comboEl.classList.remove("show");
  player.userData.halo.material.color.set(STAGES[0].color);
  for(let i=0;i<FOOD_COUNT;i++) respawnFood(i);
  enemies.forEach(e=>respawnEnemy(e,true));
  for(let i=0;i<TRAIL_COUNT;i++) trail[i].life=0;
  for(let i=0;i<PARTICLE_COUNT;i++) particleData[i].life=0;
  for(let i=0;i<BUBBLE_COUNT;i++){ bubbles[i].x=rand(bounds.minX,bounds.maxX); bubbles[i].y=rand(bounds.minY,bounds.maxY); }
  updatePlankton(0,true);
}
function startGame(){
  if(started) return;
  initAudio();
  resumeAudio();
  started=true;
  gameOver=false;
  startScreen.classList.add("hidden");
  gameOverEl.classList.add("hidden");
  initWorld();
  helpEl.classList.remove("hide");
  setTimeout(()=>helpEl.classList.add("hide"),6500);
}
function restart(){
  gameOver=false;
  gameOverEl.classList.add("hidden");
  recordEl.classList.remove("show");
  initWorld();
  resumeAudio();
}

function screenToWorld(cx,cy){
  const nx=(cx/window.innerWidth)*2-1, ny=-(cy/window.innerHeight)*2+1;
  tmpVec3.set(nx,ny,.5).unproject(camera);
  const dir=tmpVec3.sub(camera.position).normalize();
  const tt=-camera.position.z/dir.z;
  return camera.position.clone().add(dir.multiplyScalar(tt));
}
function setPointerFromEvent(e){
  const p=screenToWorld(e.clientX,e.clientY);
  pointerTarget.set(clamp(p.x,bounds.minX,bounds.maxX),clamp(p.y,bounds.minY,bounds.maxY));
  pointerActive=true;
}
window.addEventListener("pointerdown",(e)=>{
  initAudio();
  resumeAudio();
  setPointerFromEvent(e);
  if(e.target===renderer.domElement && renderer.domElement.setPointerCapture){
    try{ renderer.domElement.setPointerCapture(e.pointerId); }catch(_){}
  }
},{passive:true});
window.addEventListener("pointermove",(e)=>setPointerFromEvent(e),{passive:true});
window.addEventListener("keydown",(e)=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if(!started && (e.key==="Enter"||e.key===" ")) startGame();
  else if(gameOver && (e.key==="Enter"||e.key===" ")) restart();
},{passive:false});
window.addEventListener("keyup",(e)=>{keys[e.key.toLowerCase()]=false});
window.addEventListener("blur",()=>{for(const k in keys) keys[k]=false});
window.addEventListener("contextmenu",(e)=>e.preventDefault());

startScreen.addEventListener("click",()=>startGame());
$("startBtn").addEventListener("click",(e)=>{e.stopPropagation();startGame()});
gameOverEl.addEventListener("click",()=>{ if(performance.now()-goAt>280) restart(); });
$("restartBtn").addEventListener("click",(e)=>{e.stopPropagation();sfxClick();restart()});
$("soundBtn").addEventListener("click",(e)=>{
  e.stopPropagation();
  muted=!muted;
  $("soundBtn").textContent=muted?"🔇":"🔊";
  if(!muted){ initAudio(); resumeAudio(); sfxClick(); }
});
$("copyBtn").addEventListener("click",(e)=>{
  e.stopPropagation();
  sfxClick();
  copyText(fullShareText()).then(()=>toast("記録をコピーしました📋")).catch(()=>toast("コピーできませんでした"));
});
$("shareBtn").addEventListener("click",(e)=>{
  e.stopPropagation();
  sfxClick();
  const data={title:"フィッシュフレンジー",text:shareStr()};
  if(location.protocol.indexOf("http")===0) data.url=location.href;
  if(navigator.share){
    navigator.share(data).catch(()=>{});
  }else{
    copyText(fullShareText()).then(()=>toast("共有文をコピーしました📣")).catch(()=>toast("共有できませんでした"));
  }
});
$("xBtn").addEventListener("click",(e)=>{
  e.stopPropagation();
  sfxClick();
  let url="https://twitter.com/intent/tweet?text="+encodeURIComponent(shareStr());
  if(location.protocol.indexOf("http")===0) url+="&url="+encodeURIComponent(location.href);

function keyboardDirection(){
  let x=0,y=0;
  if(keys["a"]||keys["arrowleft"]) x-=1;
  if(keys["d"]||keys["arrowright"]) x+=1;
  if(keys["w"]||keys["arrowup"]) y+=1;
  if(keys["s"]||keys["arrowdown"]) y-=1;
  tmpVec2.set(x,y);
  if(tmpVec2.lengthSq()>0) tmpVec2.normalize();
  return tmpVec2;
}
function updatePlayer(dt,t){
  if(!started || gameOver){
    animateFish(player,t,.6);
    player.userData.vx=0; player.userData.vy=0;
    player.position.z=Math.sin(t*1.5)*.1;
    return;
  }
  const dir=keyboardDirection();
  const kb=dir.lengthSq()>.001;
  const px=player.position.x, py=player.position.y;
  const speed=5.4*(1.32/(1+.17*(playerScale-1)));
  if(kb){
    pointerActive=false;
    player.position.x+=dir.x*speed*dt;
    player.position.y+=dir.y*speed*dt;
  }else if(pointerActive){
    const dx=pointerTarget.x-px, dy=pointerTarget.y-py, d=Math.hypot(dx,dy);
    if(d>.02){
      const step=Math.min(d,speed*dt);
      player.position.x+=dx/d*step;
      player.position.y+=dy/d*step;
    }
  }
  player.position.x=clamp(player.position.x,bounds.minX,bounds.maxX);
  player.position.y=clamp(player.position.y,bounds.minY,bounds.maxY);
  player.position.z=Math.sin(t*1.8)*.08;
  const vx=player.position.x-px, vy=player.position.y-py;
  player.userData.vx=vx; player.userData.vy=vy;
  orientFish(player,vx,vy,dt,12);
  animateFish(player,t,kb?1.4:1.05+Math.hypot(vx,vy)*8);
}
function spawnTrailBubble(){
  const b=trail[trailIndex];
  trailIndex=(trailIndex+1)%TRAIL_COUNT;
  const back=1.2*playerScale;
  const bx=player.userData.facingLeft?back:-back;
  b.x=player.position.x+bx+rand(-.12,.12);
  b.y=player.position.y+rand(-.16,.16);
  b.z=player.position.z+rand(-.22,.22);
  b.maxLife=.8+Math.random()*.6;
  b.life=b.maxLife;
  b.size=(.1+Math.random()*.16)*(.8+playerScale*.4);
  b.vy=.4+Math.random()*.55;
  b.sway=Math.random()*Math.PI*2;
}
function updateTrail(dt,t){
  if(started && !gameOver){
    const sp=Math.hypot(player.userData.vx||0,player.userData.vy||0);
    trailTimer-=dt;
    if(trailTimer<=0 && sp>.004){
      spawnTrailBubble();
      trailTimer=.05-Math.min(.025,sp*.4);
    }
  }
  for(let i=0;i<TRAIL_COUNT;i++){
    const b=trail[i];
    if(b.life>0){
      b.life-=dt;
      b.y+=b.vy*dt;
      b.x+=Math.sin(t*3+b.sway)*dt*.18;
      const k=Math.max(0,b.life/b.maxLife);
      const s=b.size*(.35+k*.95);
      dummy.position.set(b.x,b.y,b.z);
      dummy.rotation.set(0,0,0);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      trailMesh.setMatrixAt(i,dummy.matrix);
      const c=k*.7;
      trailMesh.setColorAt(i,tmpColor.setRGB(c*.65,c*.92,c));
    }else{
      dummy.scale.setScalar(0);
      dummy.updateMatrix();
      trailMesh.setMatrixAt(i,dummy.matrix);
      trailMesh.setColorAt(i,tmpColor.setRGB(0,0,0));
    }
  }
  trailMesh.instanceMatrix.needsUpdate=true;
  if(trailMesh.instanceColor) trailMesh.instanceColor.needsUpdate=true;
}
function updateFood(dt,t){
  const pr=.9*playerScale;
  for(let i=0;i<FOOD_COUNT;i++){
    const f=foods[i];
    f.x+=Math.sin(t*.6+f.phase)*dt*.3;
    f.y+=(.25+f.speed)*dt;
    f.z=Math.sin(t*1.1+f.phase)*.6;
    if(f.y>bounds.maxY+1 || f.x<bounds.minX-1.5 || f.x>bounds.maxX+1.5) respawnFood(i);
    const s=f.radius*2.6*(1+Math.sin(t*3+f.phase)*.18);
    dummy.position.set(f.x,f.y,f.z);
    dummy.rotation.set(0,0,t*.5+f.phase);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    foodMesh.setMatrixAt(i,dummy.matrix);
    if(started && !gameOver && Math.hypot(f.x-player.position.x,f.y-player.position.y)<pr+f.radius+.2) eatPellet(i);
  }
  foodMesh.instanceMatrix.needsUpdate=true;
  if(foodColorDirty && foodMesh.instanceColor){
    foodMesh.instanceColor.needsUpdate=true;
    foodColorDirty=false;
  }
}
function updateEnemies(dt,t){
  const pr=.9*playerScale;
  dangerPulse=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i], u=e.userData, v=u.velocity;
    const dx=player.position.x-e.position.x, dy=player.position.y-e.position.y;
    const d=Math.hypot(dx,dy)||1;
    const edible=u.size<playerScale*.95;
    const danger=u.size>playerScale*1.06;
    let spd=u.baseSpeed*globalSpeed;
    if(started && !gameOver && edible && d<9){
      v.x-=dx/d*2.4*dt; v.y-=dy/d*2.4*dt;
      spd=Math.min(MAX_FISH_SPEED,(u.baseSpeed+1.0)*globalSpeed);
    }else if(started && !gameOver && danger && d<16){
      v.x+=dx/d*1.8*dt; v.y+=dy/d*1.8*dt;
      spd=Math.min(MAX_FISH_SPEED,(u.baseSpeed+1.5)*globalSpeed);
      dangerPulse=Math.max(dangerPulse,clamp(1-d/8,0,1));
    }else{
      const w=Math.sin(t*.7+u.phase)*.8*dt;
      const cs=Math.cos(w), sn=Math.sin(w);
      const nx=v.x*cs-v.y*sn, ny=v.x*sn+v.y*cs;
      v.set(nx,ny);
    }
    if(e.position.x<bounds.minX) v.x+=1.4*dt;
    if(e.position.x>bounds.maxX) v.x-=1.4*dt;
    if(e.position.y<bounds.minY) v.y+=1.4*dt;
    if(e.position.y>bounds.maxY) v.y-=1.4*dt;
    v.normalize();
    e.position.x+=v.x*spd*dt;
    e.position.y+=v.y*spd*dt;
    e.position.z=Math.sin(t*.9+u.phase)*.2;
    if(e.position.x<bounds.minX-12 || e.position.x>bounds.maxX+12 || e.position.y<bounds.minY-12 || e.position.y>bounds.maxY+12){
      respawnEnemy(e,false);
    }
    orientFish(e,v.x,v.y,dt,4);
    animateFish(e,t+u.phase,.7+spd*.25);

    const halo=u.halo, mat=halo.material;
    if(edible){
      mat.color.set(0x5dff9b);
      mat.opacity=(.4+(d<6?.35*(1-d/6):0))*(.85+.15*Math.sin(t*8+u.phase));
    }else if(danger){
      const near=d<7?(1-d/7):0;
      mat.color.set(0xff5252);
      mat.opacity=(.32+near*.55)*(.8+.2*Math.sin(t*(6+near*6)+u.phase));
    }else{
      mat.color.set(0x8fd8ff);
      mat.opacity=.12;
    }
    const hw=clamp(2.6+u.size*1.1, 3.0, 7.5)/u.size;
    halo.scale.set(hw,hw,1);

    if(started && !gameOver){
      const er=.8*u.size;
      if(d<pr+er){
        if(edible) eatFish(e);
        else if(danger) triggerGameOver();
        else{
          const push=(pr+er-d);
          e.position.x-=dx/d*push;
          e.position.y-=dy/d*push;
        }
      }
    }
  }
  dangerFlashEl.style.opacity=String(Math.min(.45,dangerPulse*.42));
}
function updateParticles(dt){
  for(let i=0;i<PARTICLE_COUNT;i++){
    const p=particleData[i];
    if(p.life>0){
      p.life-=dt;
      p.vy+=.6*dt;
      p.vx*=(1-1.6*dt); p.vy*=(1-.9*dt); p.vz*=(1-1.6*dt);
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      const k=Math.max(0,p.life/p.maxLife);
      const s=p.size*(.3+k);
      dummy.position.set(p.x,p.y,p.z);
      dummy.rotation.set(0,0,0);
      dummy.scale.set(s,s,s);
      dummy.updateMatrix();
      particleMesh.setMatrixAt(i,dummy.matrix);
      const kk=k*k;
      particleMesh.setColorAt(i,tmpColor.setRGB(p.r*kk,p.g*kk,p.b*kk));
    }else{
      dummy.scale.set(0,0,0);
      dummy.updateMatrix();
      particleMesh.setMatrixAt(i,dummy.matrix);
      particleMesh.setColorAt(i,tmpColor.setRGB(0,0,0));
    }
  }
  particleMesh.instanceMatrix.needsUpdate=true;
  if(particleMesh.instanceColor) particleMesh.instanceColor.needsUpdate=true;
}
function updateBubbles(dt,t){
  for(let i=0;i<BUBBLE_COUNT;i++){
    const b=bubbles[i];
    b.y+=b.speed*dt;
    b.x+=Math.sin(t*1.1+b.phase+b.y*.2)*dt*.35;
    if(b.y>bounds.maxY+1.3){
      b.y=bounds.minY-rand(.4,2.4);
      b.x=rand(bounds.minX,bounds.maxX);
      b.z=-5+Math.random()*10;
      b.r=.45+Math.random()*1.15;
      b.speed=1+Math.random()*1.9;
    }
    const s=b.r*(.72+.18*Math.sin(t*2.2+b.phase));
    dummy.position.set(b.x,b.y,b.z);
    dummy.rotation.set(0,0,0);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    bubbleMesh.setMatrixAt(i,dummy.matrix);
  }
  bubbleMesh.instanceMatrix.needsUpdate=true;
}
function updatePlankton(t,reset=false){
  const pos=planktonGeo.attributes.position.array;
  for(let i=0;i<PLANKTON_COUNT;i++){
    const idx=i*3;
    if(reset || pos[idx+1]<bounds.minY-1 || pos[idx+1]>bounds.maxY+1 || pos[idx]<bounds.minX-1 || pos[idx]>bounds.maxX+1){
      pos[idx]=rand(bounds.minX,bounds.maxX);
      pos[idx+1]=rand(bounds.minY,bounds.maxY);
      pos[idx+2]=-8+Math.random()*9;
    }else{
      pos[idx]+=Math.sin(t*.35+planktonSeed[i])*.003;
      pos[idx+1]+=.004+Math.cos(t*.29+planktonSeed[i])*.002;
    }
  }
  planktonGeo.attributes.position.needsUpdate=true;
}
function updateBoids(dt,t){
  const R=4.5, sepR=1.6;
  const minX=bounds.minX*1.3, maxX=bounds.maxX*1.3, minY=bounds.minY*1.3, maxY=bounds.maxY*1.3;
  for(let i=0;i<BOID_COUNT;i++){
    const b=boids[i];
    let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0;
    for(let j=0;j<BOID_COUNT;j++){
      if(i===j) continue;
      const dx=boids[j].x-b.x, dy=boids[j].y-b.y, d2=dx*dx+dy*dy;
      if(d2<R*R){
        ax+=boids[j].vx; ay+=boids[j].vy; cx+=boids[j].x; cy+=boids[j].y; n++;
        if(d2<sepR*sepR){
          const d=Math.sqrt(d2)||.01;
          sx-=dx/d; sy-=dy/d;
        }
      }
    }
    if(n>0){
      ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y;
      b.vx+=(ax-b.vx)*.4*dt+cx*.25*dt+sx*1.2*dt;
      b.vy+=(ay-b.vy)*.4*dt+cy*.25*dt+sy*1.2*dt;
    }
    b.vx+=Math.cos(t*.5+i)*.2*dt;
    b.vy+=Math.sin(t*.4+i*1.3)*.2*dt;
    if(b.x<minX)b.vx+=1*dt;
    if(b.x>maxX)b.vx-=1*dt;
    if(b.y<minY)b.vy+=1*dt;
    if(b.y>maxY)b.vy-=1*dt;
    const dxp=b.x-player.position.x, dyp=b.y-player.position.y, dp=Math.hypot(dxp,dyp);
    if(dp<5 && started && dp>.001){
      b.vx+=dxp/dp*1.5*dt;
      b.vy+=dyp/dp*1.5*dt;
    }
    const sp=Math.hypot(b.vx,b.vy), mx=3.2, mn=1.2;
    if(sp>mx){ b.vx=b.vx/sp*mx; b.vy=b.vy/sp*mx; }
    else if(sp<mn && sp>.001){ b.vx=b.vx/sp*mn; b.vy=b.vy/sp*mn; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<minX-2)b.x=maxX+2;
    if(b.x>maxX+2)b.x=minX-2;
    if(b.y<minY-2)b.y=maxY+2;
    if(b.y>maxY+2)b.y=minY-2;
    dummy.position.set(b.x,b.y,b.z);
    dummy.rotation.set(0,0,Math.atan2(b.vy,b.vx));
    dummy.scale.set(1,1,1);
    dummy.updateMatrix();
    boidMesh.setMatrixAt(i,dummy.matrix);
  }
  boidMesh.instanceMatrix.needsUpdate=true;
}
function updateBokeh(dt,t){
  const minX=bounds.minX*1.6, maxX=bounds.maxX*1.6, minY=bounds.minY*1.6, maxY=bounds.maxY*1.6;
  for(let i=0;i<BOKEH_COUNT;i++){
    const k=bokeh[i];
    k.y+=k.spd*dt;
    k.x+=Math.sin(t*.3+k.ph)*dt*.4;
    if(k.y>maxY+k.r){ k.y=minY-k.r; k.x=rand(minX,maxX); }
    if(k.x<minX-k.r) k.x=maxX+k.r;
    if(k.x>maxX+k.r) k.x=minX-k.r;
    const s=k.r*(.92+.08*Math.sin(t*.8+k.ph));
    dummy.position.set(k.x,k.y,k.z);
    dummy.rotation.set(0,0,0);
    dummy.scale.set(s,s,s);
    dummy.updateMatrix();
    bokehMesh.setMatrixAt(i,dummy.matrix);
  }
  bokehMesh.instanceMatrix.needsUpdate=true;
}
function updateLights(t){
  glowLight.position.x=Math.sin(t*.43)*bounds.width*.22;
  glowLight.position.y=bounds.maxY*.45+Math.sin(t*.7)*1.4;
  glowLight.position.z=7+Math.cos(t*.5)*2;
  sun.position.x=-8+Math.sin(t*.25)*4;
  sun.position.y=14+Math.cos(t*.2)*2;
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.033);
  const t=clock.elapsedTime;

  globalSpeed=1+Math.min(.62,score/3200);
  bgUniforms.uTime.value=t;

  for(let i=0;i<rays.length;i++){
    rays[i].material.uniforms.uTime.value=t;
    rays[i].position.x=-bounds.width*.52+i*bounds.width/6+Math.sin(t*.18+i)*.55;
  }

  updateLights(t);

  if(started && !gameOver){
    comboTimer-=dt;
    if(comboTimer<=0){ comboCount=0; combo=1; }
  }

  updatePlayer(dt,t);
  updateTrail(dt,t);
  updateFood(dt,t);
  updateEnemies(dt,t);
  updateParticles(dt);
  updateBubbles(dt,t);
  updatePlankton(t,false);
  updateBoids(dt,t);
  updateBokeh(dt,t);
  updateComboUI();

  const ph=player.userData.halo;
  const phw=clamp(2.2+playerScale*.9, 2.6, 6.5)/playerScale;
  ph.scale.set(phw,phw,1);
  ph.material.opacity=(gameOver?.16:.42)+.16*Math.sin(t*4);

  camBaseX+=(player.position.x*.06-camBaseX)*Math.min(1,dt*2.4);
  camBaseY+=(player.position.y*.06-camBaseY)*Math.min(1,dt*2.4);
  shake=Math.max(0,shake-dt*1.8);
  const sh=shake*shake*1.4;
  camera.position.x=camBaseX+(Math.random()-.5)*sh;
  camera.position.y=camBaseY+(Math.random()-.5)*sh;
  camera.position.z=34+(Math.random()-.5)*sh*.6;
  camera.lookAt(camBaseX,camBaseY,0);

  renderer.render(scene,camera);
}
function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,DPR_CAP));
  renderer.setSize(window.innerWidth,window.innerHeight);
  bgUniforms.uAspect.value=camera.aspect;
  computeBounds();
  background.scale.setScalar(Math.max(1,camera.aspect));
  pointerTarget.set(clamp(pointerTarget.x,bounds.minX,bounds.maxX),clamp(pointerTarget.y,bounds.minY,bounds.maxY));
}
window.addEventListener("resize",onResize);

onResize();
initWorld();
animate();
</script>
