<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>水中を泳ぐ魚のゲーム</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #031826;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: rgba(235, 252, 255, 0.96);
      text-shadow: 0 2px 10px rgba(0, 20, 38, 0.9);
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      box-sizing: border-box;
    }
    #scoreBox {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border: 1px solid rgba(180, 245, 255, 0.3);
      border-radius: 999px;
      background: rgba(0, 28, 48, 0.38);
      backdrop-filter: blur(8px);
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18);
    }
    #score {
      display: inline-block;
      min-width: 1.2em;
      font-size: clamp(22px, 4vw, 34px);
      color: #fff99b;
      transition: transform 0.12s ease;
    }
    #help {
      position: fixed;
      left: 16px;
      bottom: max(14px, env(safe-area-inset-bottom));
      max-width: min(760px, calc(100vw - 32px));
      padding: 10px 13px;
      border-radius: 16px;
      background: rgba(0, 28, 48, 0.34);
      border: 1px solid rgba(180, 245, 255, 0.22);
      backdrop-filter: blur(8px);
      font-size: clamp(12px, 2.4vw, 15px);
      line-height: 1.55;
    }
    #centerMessage {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      pointer-events: auto;
      background: radial-gradient(circle at center, rgba(0, 35, 58, 0.16), rgba(0, 8, 18, 0.58));
      color: white;
      text-align: center;
    }
    #panel {
      width: min(430px, 92vw);
      padding: 28px 22px 22px;
      border: 1px solid rgba(190, 248, 255, 0.34);
      border-radius: 28px;
      background: rgba(2, 27, 47, 0.76);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(12px);
    }
    #panel h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 8vw, 48px);
      letter-spacing: 0.06em;
    }
    #finalScore {
      margin: 6px 0 8px;
      font-size: 19px;
      color: #bff7ff;
    }
    #restartHint {
      margin: 0 0 18px;
      font-size: 13px;
      color: rgba(235, 252, 255, 0.72);
    }
    #restartBtn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 13px 23px;
      font: inherit;
      font-weight: 800;
      color: #05304a;
      background: linear-gradient(180deg, #fff5a6, #75edff);
      box-shadow: 0 10px 26px rgba(91, 231, 255, 0.25);
      cursor: pointer;
    }
    #restartBtn:active {
      transform: translateY(1px) scale(0.99);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div id="scoreBox">スコア <span id="score">0</span></div>
    <div id="help">操作: マウス/タップで魚が追従。WASD・矢印キーでも移動できます。光る餌を食べると成長。大きな敵の魚に触れるとゲームオーバー！</div>
  </div>

  <div id="centerMessage">
    <div id="panel">
      <h1>GAME OVER</h1>
      <div id="finalScore">スコア: 0</div>
      <div id="restartHint">Enter / Space でもリスタートできます</div>
      <button id="restartBtn">もう一度泳ぐ</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";

    const scoreEl = document.getElementById("score");
    const centerMessage = document.getElementById("centerMessage");
    const finalScoreEl = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x073a52, 0.013);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 34);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setClearColor(0x031826, 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const clock = new THREE.Clock();
    const tmpVec2 = new THREE.Vector2();
    const tmpVec3 = new THREE.Vector3();
    const dummy = new THREE.Object3D();

    let bounds = { minX: -16, maxX: 16, minY: -10, maxY: 10, width: 32, height: 20 };
    let score = 0;
    let gameOver = false;
    let playerScale = 1;
    let pointerActive = true;
    let scorePulseT = 0;

    const pointerTarget = new THREE.Vector2(0, 0);
    const keys = Object.create(null);

    const bgUniforms = {
      uTime: { value: 0 },
      uAspect: { value: window.innerWidth / window.innerHeight }
    };

    const background = new THREE.Mesh(
      new THREE.PlaneGeometry(140, 90, 1, 1),
      new THREE.ShaderMaterial({
        depthWrite: false,
        depthTest: false,
        uniforms: bgUniforms,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision mediump float;
          varying vec2 vUv;
          uniform float uTime;
          uniform float uAspect;

          float wave(vec2 p) {
            float a = sin(p.x * 18.0 + uTime * 0.9 + sin(p.y * 8.0 + uTime * 0.45));
            float b = sin((p.x + p.y) * 28.0 - uTime * 1.25);
            float c = sin(length(p - vec2(0.5, 0.62)) * 42.0 - uTime * 1.7);
            return (a + b + c) / 3.0;
          }

          void main() {
            vec2 uv = vUv;
            uv.x += sin(uv.y * 10.0 + uTime * 0.45) * 0.015;
            uv.y += sin(uv.x * 7.0 - uTime * 0.35) * 0.012;

            vec3 deep = vec3(0.005, 0.055, 0.115);
            vec3 mid = vec3(0.02, 0.22, 0.34);
            vec3 top = vec3(0.08, 0.58, 0.68);
            vec3 col = mix(deep, mid, smoothstep(0.0, 1.0, uv.y));
            col = mix(col, top, pow(max(uv.y, 0.0), 2.3) * 0.55);

            float caustic = pow(abs(wave(uv * vec2(uAspect, 1.0))), 7.0) * 0.55;
            float shafts = smoothstep(0.72, 1.0, uv.y) * (0.5 + 0.5 * sin((uv.x * 16.0) + uTime * 0.32));
            float vignette = smoothstep(0.92, 0.25, distance(uv, vec2(0.5, 0.54)));

            col += vec3(0.18, 0.52, 0.62) * caustic * (0.35 + uv.y * 0.85);
            col += vec3(0.13, 0.36, 0.42) * shafts * 0.18;
            col *= 0.68 + vignette * 0.42;

            gl_FragColor = vec4(col, 1.0);
          }
        `
      })
    );
    background.position.z = -40;
    scene.add(background);

    const ambient = new THREE.HemisphereLight(0xa8f4ff, 0x001423, 1.15);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xd3fbff, 1.9);
    sun.position.set(-8, 14, 12);
    scene.add(sun);

    const glowLight = new THREE.PointLight(0x5cf3ff, 1.6, 28, 2);
    glowLight.position.set(6, 5, 8);
    scene.add(glowLight);

    function makeRay(index) {
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uSeed: { value: index * 13.17 }
        },
        vertexShader: `
          varying vec2 vUv;
          uniform float uTime;
          uniform float uSeed;
          void main() {
            vUv = uv;
            vec3 p = position;
            p.x += sin(p.y * 0.16 + uTime * 0.45 + uSeed) * 0.35;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uTime;
          uniform float uSeed;
          void main() {
            float side = smoothstep(0.0, 0.5, vUv.x) * smoothstep(1.0, 0.5, vUv.x);
            float fade = smoothstep(0.0, 0.18, vUv.y) * smoothstep(1.0, 0.28, vUv.y);
            float flicker = 0.65 + 0.35 * sin(uTime * 0.7 + uSeed);
            gl_FragColor = vec4(0.34, 0.9, 1.0, side * fade * flicker * 0.13);
          }
        `
      });

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 42, 1, 8), mat);
      mesh.position.set(-18 + index * 6.0, 2.4, -10 - index * 0.4);
      mesh.rotation.z = THREE.MathUtils.degToRad(-12 + index * 4);
      return mesh;
    }

    const rays = [];
    for (let i = 0; i < 7; i++) {
      const ray = makeRay(i);
      rays.push(ray);
      scene.add(ray);
    }

    function createFish(opts) {
      const group = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: opts.body,
        roughness: 0.42,
        metalness: 0.02,
        emissive: opts.enemy ? 0x180018 : 0x4a1a00,
        emissiveIntensity: opts.enemy ? 0.16 : 0.08
      });

      const finMat = new THREE.MeshStandardMaterial({
        color: opts.fin,
        roughness: 0.5,
        metalness: 0.0,
        side: THREE.DoubleSide,
        emissive: opts.enemy ? 0x1b0022 : 0x331500,
        emissiveIntensity: 0.14
      });

      const body = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), bodyMat);
      body.scale.set(1.42, 0.62, 0.5);
      group.add(body);

      const tailShape = new THREE.Shape();
      tailShape.moveTo(0, 0);
      tailShape.lineTo(-0.95, 0.72);
      tailShape.lineTo(-0.62, 0.0);
      tailShape.lineTo(-0.95, -0.72);
      tailShape.closePath();
      const tail = new THREE.Mesh(new THREE.ShapeGeometry(tailShape), finMat);
      tail.position.set(-1.2, 0, 0);
      group.add(tail);

      const topFinShape = new THREE.Shape();
      topFinShape.moveTo(-0.4, 0.5);
      topFinShape.lineTo(0.25, 1.05);
      topFinShape.lineTo(0.62, 0.42);
      topFinShape.closePath();
      const topFin = new THREE.Mesh(new THREE.ShapeGeometry(topFinShape), finMat);
      group.add(topFin);

      const bottomFinShape = new THREE.Shape();
      bottomFinShape.moveTo(-0.2, -0.46);
      bottomFinShape.lineTo(0.5, -1.0);
      bottomFinShape.lineTo(0.8, -0.4);
      bottomFinShape.closePath();
      const bottomFin = new THREE.Mesh(new THREE.ShapeGeometry(bottomFinShape), finMat);
      group.add(bottomFin);

      const sideFinShape = new THREE.Shape();
      sideFinShape.moveTo(0.1, 0.0);
      sideFinShape.lineTo(0.78, -0.6);
      sideFinShape.lineTo(0.6, 0.05);
      sideFinShape.closePath();
      const sideFinGeo = new THREE.ShapeGeometry(sideFinShape);
      const sideFinA = new THREE.Mesh(sideFinGeo, finMat);
      sideFinA.position.z = 0.42;
      const sideFinB = new THREE.Mesh(sideFinGeo, finMat);
      sideFinB.position.z = -0.42;
      group.add(sideFinA, sideFinB);

      const eyeWhiteGeo = new THREE.SphereGeometry(0.13, 12, 10);
      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const pupilGeo = new THREE.SphereGeometry(0.06, 10, 8);
      const pupilMat = new THREE.MeshBasicMaterial({ color: opts.enemy ? 0x2a0008 : 0x05101a });

      for (const sgn of [1, -1]) {
        const eye = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        eye.position.set(0.9, 0.2, 0.34 * sgn);
        group.add(eye);

        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.set(0.95, 0.19, 0.42 * sgn);
        group.add(pupil);
      }

      const mouth = new THREE.Mesh(
        new THREE.TorusGeometry(0.085, 0.02, 8, 18, Math.PI),
        new THREE.MeshBasicMaterial({ color: opts.enemy ? 0x2a0020 : 0x5a2400 })
      );
      mouth.position.set(1.28, -0.08, 0);
      mouth.rotation.z = -0.2;
      group.add(mouth);

      group.userData.tail = tail;
      group.userData.sideFins = [sideFinA, sideFinB];
      group.userData.body = body;
      group.userData.flip = 0;
      group.userData.facingLeft = false;

      return group;
    }

    const player = createFish({ body: 0xff9d2d, fin: 0xffdb62, enemy: false });
    player.position.set(0, 0, 0);
    scene.add(player);

    const foodGroup = new THREE.Group();
    scene.add(foodGroup);

    const foods = [];
    const foodGeo = new THREE.SphereGeometry(0.17, 10, 8);
    const foodMats = [
      new THREE.MeshStandardMaterial({ color: 0xfff36c, emissive: 0xffcc38, emissiveIntensity: 0.7, roughness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0x9bffea, emissive: 0x42e8ff, emissiveIntensity: 0.55, roughness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0xff9de8, emissive: 0xff51c8, emissiveIntensity: 0.45, roughness: 0.3 })
    ];

    for (let i = 0; i < 48; i++) {
      const food = new THREE.Mesh(foodGeo, foodMats[i % foodMats.length]);
      food.userData.phase = Math.random() * Math.PI * 2;
      food.userData.speed = 0.08 + Math.random() * 0.18;
      food.userData.radius = 0.18 + Math.random() * 0.09;
      foods.push(food);
      foodGroup.add(food);
    }

    const enemies = [];
    for (let i = 0; i < 5; i++) {
      const enemy = createFish({
        body: i % 2 ? 0x6b2d8f : 0x23436f,
        fin: i % 2 ? 0xd856ff : 0x48a4d8,
        enemy: true
      });
      enemy.userData.phase = Math.random() * Math.PI * 2;
      enemy.userData.speed = 1.25 + Math.random() * 0.6;
      enemy.userData.size = 1.42 + Math.random() * 0.45;
      enemy.userData.aggro = 0.25 + Math.random() * 0.5;
      enemy.userData.velocity = new THREE.Vector2(
        Math.random() < 0.5 ? -1 : 1,
        (Math.random() - 0.5) * 0.45
      ).normalize();
      enemy.scale.setScalar(enemy.userData.size);
      enemies.push(enemy);
      scene.add(enemy);
    }

    const bubbleCount = 90;
    const bubbleGeo = new THREE.SphereGeometry(0.08, 8, 6);
    const bubbleMat = new THREE.MeshStandardMaterial({
      color: 0xcdfaff,
      transparent: true,
      opacity: 0.46,
      roughness: 0.08,
      metalness: 0.0,
      emissive: 0x4bdcff,
      emissiveIntensity: 0.1
    });
    const bubbleMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, bubbleCount);
    bubbleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(bubbleMesh);

    const bubbles = [];
    for (let i = 0; i < bubbleCount; i++) {
      bubbles.push({
        x: 0,
        y: 0,
        z: -5 + Math.random() * 10,
        r: 0.45 + Math.random() * 1.15,
        speed: 1.0 + Math.random() * 1.9,
        phase: Math.random() * Math.PI * 2
      });
    }

    const planktonCount = 180;
    const planktonGeo = new THREE.BufferGeometry();
    const planktonPos = new Float32Array(planktonCount * 3);
    const planktonSeed = new Float32Array(planktonCount);
    for (let i = 0; i < planktonCount; i++) {
      planktonSeed[i] = Math.random() * Math.PI * 2;
      planktonPos[i * 3 + 2] = -8 + Math.random() * 9;
    }
    planktonGeo.setAttribute("position", new THREE.BufferAttribute(planktonPos, 3));
    const plankton = new THREE.Points(
      planktonGeo,
      new THREE.PointsMaterial({
        color: 0xb9f8ff,
        size: 0.05,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      })
    );
    scene.add(plankton);

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function distance2D(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function computeBounds() {
      const dist = camera.position.z;
      const viewH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * dist;
      const viewW = viewH * camera.aspect;
      const margin = Math.max(1.25, Math.min(viewW, viewH) * 0.055);

      bounds.width = viewW;
      bounds.height = viewH;
      bounds.minX = -viewW * 0.5 + margin;
      bounds.maxX = viewW * 0.5 - margin;
      bounds.minY = -viewH * 0.5 + margin;
      bounds.maxY = viewH * 0.5 - margin;
    }

    function randomPointAwayFromPlayer(minDist = 4) {
      let x = 0;
      let y = 0;
      for (let i = 0; i < 60; i++) {
        x = rand(bounds.minX, bounds.maxX);
        y = rand(bounds.minY, bounds.maxY);
        if (Math.hypot(x - player.position.x, y - player.position.y) > minDist) break;
      }
      return { x, y };
    }

    function respawnFood(food) {
      const p = randomPointAwayFromPlayer(2.3);
      food.position.set(p.x, p.y, rand(-0.8, 1.5));
      food.userData.phase = Math.random() * Math.PI * 2;
      food.userData.speed = 0.08 + Math.random() * 0.18;
      food.userData.radius = 0.16 + Math.random() * 0.1;
      food.scale.setScalar(food.userData.radius / 0.18);
    }

    function snapFish(obj, vx, vy) {
      const heading = Math.atan2(vy, vx);
      const left = vx < 0;
      obj.userData.facingLeft = left;
      obj.userData.flip = left ? 1 : 0;
      obj.rotation.y = obj.userData.flip * Math.PI;
      obj.rotation.z = left ? (Math.PI - heading) : heading;
    }

    function orientFish(obj, vx, vy, dt, turn) {
      if (vx * vx + vy * vy < 1e-7) return;

      const heading = Math.atan2(vy, vx);

      if (vx > 0.02) obj.userData.facingLeft = false;
      else if (vx < -0.02) obj.userData.facingLeft = true;

      const left = obj.userData.facingLeft;
      const targetZ = left ? (Math.PI - heading) : heading;
      let dz = targetZ - obj.rotation.z;
      dz = Math.atan2(Math.sin(dz), Math.cos(dz));
      obj.rotation.z += dz * Math.min(1, dt * turn);

      const targetFlip = left ? 1 : 0;
      obj.userData.flip += (targetFlip - obj.userData.flip) * Math.min(1, dt * (turn * 1.2));
      obj.rotation.y = obj.userData.flip * Math.PI;
    }

    function respawnEnemy(enemy, first = false) {
      const side = Math.floor(Math.random() * 4);
      let x;
      let y;

      if (side === 0) {
        x = bounds.minX - rand(2, 6);
        y = rand(bounds.minY, bounds.maxY);
      } else if (side === 1) {
        x = bounds.maxX + rand(2, 6);
        y = rand(bounds.minY, bounds.maxY);
      } else if (side === 2) {
        x = rand(bounds.minX, bounds.maxX);
        y = bounds.minY - rand(2, 5);
      } else {
        x = rand(bounds.minX, bounds.maxX);
        y = bounds.maxY + rand(2, 5);
      }

      if (first) {
        const p = randomPointAwayFromPlayer(8);
        x = p.x;
        y = p.y;
      }

      enemy.position.set(x, y, rand(-0.25, 0.25));

      const targetX = rand(bounds.minX, bounds.maxX);
      const targetY = rand(bounds.minY, bounds.maxY);
      enemy.userData.velocity.set(targetX - x, targetY - y).normalize();
      enemy.userData.speed = 1.15 + Math.random() * 0.8;
      enemy.userData.phase = Math.random() * Math.PI * 2;
      snapFish(enemy, enemy.userData.velocity.x, enemy.userData.velocity.y);
    }

    function initWorld() {
      computeBounds();

      player.position.set(0, 0, 0);
      player.rotation.set(0, 0, 0);
      player.userData.flip = 0;
      player.userData.facingLeft = false;

      pointerTarget.set(0, 0);
      pointerActive = true;
      playerScale = 1;
      player.scale.setScalar(playerScale);

      score = 0;
      scoreEl.textContent = score;
      clearTimeout(scorePulseT);
      scoreEl.style.transform = "scale(1)";

      foods.forEach(respawnFood);
      enemies.forEach(enemy => respawnEnemy(enemy, true));

      for (let i = 0; i < bubbleCount; i++) {
        bubbles[i].x = rand(bounds.minX, bounds.maxX);
        bubbles[i].y = rand(bounds.minY, bounds.maxY);
      }

      updatePlankton(0, true);
    }

    function eatFood(food) {
      score++;
      scoreEl.textContent = score;
      scoreEl.style.transform = "scale(1.28)";
      clearTimeout(scorePulseT);
      scorePulseT = setTimeout(() => {
        scoreEl.style.transform = "scale(1)";
      }, 120);

      playerScale = Math.min(2.18, 1 + score * 0.022);
      player.scale.setScalar(playerScale);
      respawnFood(food);
    }

    function triggerGameOver() {
      if (gameOver) return;
      gameOver = true;
      finalScoreEl.textContent = `スコア: ${score}`;
      centerMessage.style.display = "flex";
    }

    function restart() {
      gameOver = false;
      centerMessage.style.display = "none";
      initWorld();
    }

    function screenToWorld(clientX, clientY) {
      const ndcX = (clientX / window.innerWidth) * 2 - 1;
      const ndcY = -(clientY / window.innerHeight) * 2 + 1;
      tmpVec3.set(ndcX, ndcY, 0.5).unproject(camera);
      const dir = tmpVec3.sub(camera.position).normalize();
      const t = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(t));
    }

    function setPointerFromEvent(e) {
      const p = screenToWorld(e.clientX, e.clientY);
      pointerTarget.set(
        THREE.MathUtils.clamp(p.x, bounds.minX, bounds.maxX),
        THREE.MathUtils.clamp(p.y, bounds.minY, bounds.maxY)
      );
      pointerActive = true;
    }

    window.addEventListener("pointerdown", (e) => {
      setPointerFromEvent(e);
      if (e.target === renderer.domElement && renderer.domElement.setPointerCapture) {
        try {
          renderer.domElement.setPointerCapture(e.pointerId);
        } catch (_) {}
      }
    }, { passive: true });

    window.addEventListener("pointermove", (e) => {
      setPointerFromEvent(e);
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
      }

      if (gameOver && (e.key === "Enter" || e.key === " ")) {
        restart();
      }
    }, { passive: false });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener("blur", () => {
      for (const key in keys) keys[key] = false;
    });

    restartBtn.addEventListener("click", restart);

    function keyboardDirection() {
      let x = 0;
      let y = 0;

      if (keys["a"] || keys["arrowleft"]) x -= 1;
      if (keys["d"] || keys["arrowright"]) x += 1;
      if (keys["w"] || keys["arrowup"]) y += 1;
      if (keys["s"] || keys["arrowdown"]) y -= 1;

      tmpVec2.set(x, y);
      if (tmpVec2.lengthSq() > 0) tmpVec2.normalize();
      return tmpVec2;
    }

    function animateFish(group, t, speedFactor = 1) {
      const tail = group.userData.tail;
      const fins = group.userData.sideFins;
      const body = group.userData.body;

      if (tail) {
        tail.rotation.z = Math.sin(t * 9.0 * speedFactor + group.position.x * 0.3) * 0.34;
      }

      if (fins) {
        const flap = -0.18 + Math.sin(t * 6.5 * speedFactor) * 0.22;
        fins[0].rotation.z = flap;
        fins[1].rotation.z = flap;
      }

      if (body) {
        body.scale.y = 0.62 + Math.sin(t * 8.2 * speedFactor + group.position.y) * 0.02;
      }
    }

    function updatePlayer(dt, t) {
      if (gameOver) {
        animateFish(player, t, 0.5);
        return;
      }

      const dir = keyboardDirection();
      const keyboardMoving = dir.lengthSq() > 0.001;
      const prevX = player.position.x;
      const prevY = player.position.y;
      const speed = 6.2 / Math.sqrt(playerScale);

      if (keyboardMoving) {
        pointerActive = false;
        player.position.x += dir.x * speed * dt;
        player.position.y += dir.y * speed * dt;
      } else if (pointerActive) {
        const dx = pointerTarget.x - player.position.x;
        const dy = pointerTarget.y - player.position.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0.04) {
          const step = Math.min(dist, speed * dt);
          player.position.x += (dx / dist) * step;
          player.position.y += (dy / dist) * step;
        }
      }

      player.position.x = THREE.MathUtils.clamp(player.position.x, bounds.minX, bounds.maxX);
      player.position.y = THREE.MathUtils.clamp(player.position.y, bounds.minY, bounds.maxY);
      player.position.z = Math.sin(t * 1.8) * 0.06;

      const vx = player.position.x - prevX;
      const vy = player.position.y - prevY;
      orientFish(player, vx, vy, dt, 12);
      animateFish(player, t, keyboardMoving ? 1.35 : 1.05);
    }

    function updateFood(dt, t) {
      const playerRadius = 0.86 * playerScale;

      for (const food of foods) {
        const phase = food.userData.phase;

        food.position.x += Math.sin(t * 0.65 + phase) * dt * 0.22;
        food.position.y += (Math.cos(t * 0.48 + phase * 1.7) * 0.12 + food.userData.speed * 0.22) * dt;
        food.position.z = Math.sin(t * 1.2 + phase) * 0.55;
        food.rotation.x += dt * 1.8;
        food.rotation.y += dt * 1.2;
        food.scale.setScalar((food.userData.radius / 0.18) * (1 + Math.sin(t * 3 + phase) * 0.08));

        if (
          food.position.y > bounds.maxY + 1.2 ||
          food.position.x < bounds.minX - 1.2 ||
          food.position.x > bounds.maxX + 1.2
        ) {
          food.position.y = bounds.minY - rand(0.6, 2.0);
          food.position.x = rand(bounds.minX, bounds.maxX);
        }

        if (!gameOver && distance2D(player.position, food.position) < playerRadius + food.userData.radius + 0.14) {
          eatFood(food);
        }
      }
    }

    function updateEnemies(dt, t) {
      const playerRadius = 0.82 * playerScale;

      for (const enemy of enemies) {
        const v = enemy.userData.velocity;
        const phase = enemy.userData.phase;

        const wobble = Math.sin(t * 0.8 + phase) * 0.6 * dt;
        const cs = Math.cos(wobble);
        const sn = Math.sin(wobble);
        const nx = v.x * cs - v.y * sn;
        const ny = v.x * sn + v.y * cs;
        v.set(nx, ny);

        if (!gameOver) {
          const sx = player.position.x - enemy.position.x;
          const sy = player.position.y - enemy.position.y;
          const sd = Math.hypot(sx, sy) || 1;
          v.x += (sx / sd) * enemy.userData.aggro * dt;
          v.y += (sy / sd) * enemy.userData.aggro * dt;
        }

        v.normalize();

        enemy.position.x += v.x * enemy.userData.speed * dt;
        enemy.position.y += v.y * enemy.userData.speed * dt;
        enemy.position.z = Math.sin(t * 0.9 + phase) * 0.18;

        if (
          enemy.position.x < bounds.minX - 9 ||
          enemy.position.x > bounds.maxX + 9 ||
          enemy.position.y < bounds.minY - 8 ||
          enemy.position.y > bounds.maxY + 8
        ) {
          respawnEnemy(enemy, false);
        }

        orientFish(enemy, v.x, v.y, dt, 5);
        animateFish(enemy, t + phase, 0.7 + enemy.userData.speed * 0.25);

        if (!gameOver) {
          const enemyRadius = enemy.userData.size * 0.85;
          if (distance2D(player.position, enemy.position) < playerRadius + enemyRadius) {
            triggerGameOver();
          }
        }
      }
    }

    function updateBubbles(dt, t) {
      for (let i = 0; i < bubbleCount; i++) {
        const b = bubbles[i];

        b.y += b.speed * dt;
        b.x += Math.sin(t * 1.1 + b.phase + b.y * 0.2) * dt * 0.35;

        if (b.y > bounds.maxY + 1.3) {
          b.y = bounds.minY - rand(0.4, 2.4);
          b.x = rand(bounds.minX, bounds.maxX);
          b.z = -5 + Math.random() * 10;
          b.r = 0.45 + Math.random() * 1.15;
          b.speed = 1.0 + Math.random() * 1.9;
        }

        const s = b.r * (0.72 + 0.18 * Math.sin(t * 2.2 + b.phase));
        dummy.position.set(b.x, b.y, b.z);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();
        bubbleMesh.setMatrixAt(i, dummy.matrix);
      }

      bubbleMesh.instanceMatrix.needsUpdate = true;
    }

    function updatePlankton(t, reset = false) {
      const pos = planktonGeo.attributes.position.array;

      for (let i = 0; i < planktonCount; i++) {
        const idx = i * 3;

        if (
          reset ||
          pos[idx + 1] < bounds.minY - 1 ||
          pos[idx + 1] > bounds.maxY + 1 ||
          pos[idx] < bounds.minX - 1 ||
          pos[idx] > bounds.maxX + 1
        ) {
          pos[idx] = rand(bounds.minX, bounds.maxX);
          pos[idx + 1] = rand(bounds.minY, bounds.maxY);
          pos[idx + 2] = -8 + Math.random() * 9;
        } else {
          pos[idx] += Math.sin(t * 0.35 + planktonSeed[i]) * 0.003;
          pos[idx + 1] += 0.004 + Math.cos(t * 0.29 + planktonSeed[i]) * 0.002;
        }
      }

      planktonGeo.attributes.position.needsUpdate = true;
    }

    function updateLights(t) {
      glowLight.position.x = Math.sin(t * 0.43) * bounds.width * 0.22;
      glowLight.position.y = bounds.maxY * 0.45 + Math.sin(t * 0.7) * 1.4;
      glowLight.position.z = 7 + Math.cos(t * 0.5) * 2;

      sun.position.x = -8 + Math.sin(t * 0.25) * 4;
      sun.position.y = 14 + Math.cos(t * 0.2) * 2;
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.033);
      const t = clock.elapsedTime;

      bgUniforms.uTime.value = t;

      rays.forEach((ray, i) => {
        ray.material.uniforms.uTime.value = t;
        ray.position.x = -bounds.width * 0.52 + i * bounds.width / 6 + Math.sin(t * 0.18 + i) * 0.55;
      });

      updateLights(t);
      updatePlayer(dt, t);
      updateFood(dt, t);
      updateEnemies(dt, t);
      updateBubbles(dt, t);
      updatePlankton(t);

      camera.position.x += (player.position.x * 0.035 - camera.position.x) * Math.min(1, dt * 2.2);
      camera.position.y += (player.position.y * 0.035 - camera.position.y) * Math.min(1, dt * 2.2);
      camera.lookAt(camera.position.x, camera.position.y, 0);

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      bgUniforms.uAspect.value = camera.aspect;
      computeBounds();

      background.scale.setScalar(Math.max(1, camera.aspect));

      pointerTarget.set(
        THREE.MathUtils.clamp(pointerTarget.x, bounds.minX, bounds.maxX),
        THREE.MathUtils.clamp(pointerTarget.y, bounds.minY, bounds.maxY)
      );
    }

    window.addEventListener("resize", onResize);

    onResize();
    initWorld();
    animate();
  </script>
</body>
